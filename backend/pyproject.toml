[project]
name = "autoroad-backend"
version = "0.1.0"
description = "Backend services for AutoRoad course planning"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
    "ortools>=9.0.0",
    "fastapi>=0.121.1",
    "uvicorn>=0.38.0",
    "httpx>=0.27.0",
    "cashews>=7.0.0",
    "claude-agent-sdk>=0.1.10",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.50.0",
    "janus>=1.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
# Server needs httpx, dotenv, and fastapi extras for dev experience
server = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvloop>=0.21.0",
    "fastapi-cli>=0.0.16",
]
# Modal worker needs modal SDK
modal = [
    "modal>=1.2.4",
]
# All deps (server + modal) for local dev
all = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvloop>=0.21.0",
    "fastapi-cli>=0.0.16",
    "modal>=1.2.4",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "hypothesis>=6.0.0",
    "basedpyright>=1.33.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "fireroad: tests that validate against Fireroad API (requires network)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.basedpyright]
failOnWarnings = false
reportArgumentType = false
reportUnknownMemberType = false
reportImplicitStringConcatenation = false
reportCallInDefaultInitializer = false
reportUnnecessaryIsInstance = false
reportUnreachable = false
reportDeprecated = false
reportUnknownVariableType = false
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportUnusedVariable = false
reportUnusedParameter = false
reportUnknownArgumentType = false
reportUnusedImport = false
reportUnusedFunction = false
reportUnannotatedClassAttribute = false
reportUnknownParameterType = false
reportUnnecessaryComparison = false

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
    "requests>=2.32.5",
]
