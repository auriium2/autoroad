[project]
name = "autoroad-backend"
version = "0.1.0"
description = "Backend services for AutoRoad course planning"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "polars>=1.0.0",
    "ortools>=9.0.0",
    "basedpyright>=1.33.0",
    "pyarrow>=22.0.0",
    "fastapi[standard]>=0.121.1",
    "uvicorn>=0.38.0",
    "cachetools>=6.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "hypothesis>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prerequisites", "requirements", "scripts", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "e2e: end-to-end integration tests (deselect with '-m \"not e2e\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.basedpyright]
failOnWarnings = false
reportArgumentType = false
reportUnknownMemberType = false
reportImplicitStringConcatenation = false
reportUnknownVariableType = false
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportUnusedVariable = false
reportUnusedParameter = false
reportUnknownArgumentType = false

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]
