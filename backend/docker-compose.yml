services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - USE_WORKERS=${USE_WORKERS:-true}
      - WORKER_URL=${WORKER_URL:-https://autoroad-worker-okjtesbbua-uc.a.run.app}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
