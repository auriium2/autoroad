name: Optimizer Comprehensive Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test-optimizer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test-unit:
    name: Unit Tests (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run all unit tests
        working-directory: ./backend
        run: uv run pytest tests/unit/ -v

  test-feasibility:
    name: Feasibility - Group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            tests: "test_course_1 or test_course_2 or test_course_3_materials or test_course_3a or test_course_3c"
          - group: 2
            tests: "test_course_4 or test_course_6_2 or test_course_6_3 or test_course_6_4 or test_course_6_7"
          - group: 3
            tests: "test_course_6_9 or test_course_6_14 or test_course_7 or test_course_8 or test_course_9"
          - group: 4
            tests: "test_course_11 or test_course_12 or test_course_15 or test_course_16 or test_course_18am"
          - group: 5
            tests: "test_course_18c or test_course_18pm or test_course_20 or test_double_major or test_major_with_minor"
          - group: 6
            tests: "test_regression"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run feasibility tests (group ${{ matrix.group }})
        working-directory: ./backend
        run: uv run pytest tests/integration/optimizer/test_optimizer_feasibility.py -k "${{ matrix.tests }}" -v -s

  test-quality:
    name: Quality - Group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            tests: "test_course_1 or test_course_2 or test_course_3_quality or test_course_3a or test_course_3c"
          - group: 2
            tests: "test_course_4 or test_course_6_2 or test_course_6_3 or test_course_6_4 or test_course_6_7"
          - group: 3
            tests: "test_course_6_9 or test_course_6_14 or test_course_7 or test_course_8"
          - group: 4
            tests: "test_course_9 or test_course_11 or test_course_15 or test_course_16"
          - group: 5
            tests: "test_course_18am or test_course_18c or test_course_18pm or test_course_20"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run quality tests (group ${{ matrix.group }})
        working-directory: ./backend
        run: uv run pytest tests/integration/optimizer/test_optimizer_quality.py -k "${{ matrix.tests }}" -v -s

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run basedpyright
        working-directory: ./backend
        run: uv run basedpyright courses/ optimizer/ api/

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [test-unit, test-feasibility, test-quality, type-check]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.test-feasibility.result }}" != "success" ] || \
             [ "${{ needs.test-quality.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All tests passed!"
