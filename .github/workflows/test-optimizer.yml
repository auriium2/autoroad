name: Optimizer Comprehensive Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/test-optimizer.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:  # Allow manual triggers

jobs:
  test-unit:
    name: Unit Tests (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv sync --extra dev

      - name: Run all unit tests
        working-directory: ./backend
        run: |
          uv run pytest tests/unit/ -v

  test-feasibility:
    name: Feasibility - ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - TestOptimizerFeasibility::test_course_1_civil_engineering
          - TestOptimizerFeasibility::test_course_2_mechanical_engineering
          - TestOptimizerFeasibility::test_course_3_materials_science
          - TestOptimizerFeasibility::test_course_3a_materials_science_flexible
          - TestOptimizerFeasibility::test_course_3c_archaeology_materials
          - TestOptimizerFeasibility::test_course_4_architecture
          - TestOptimizerFeasibility::test_course_6_2_eecs
          - TestOptimizerFeasibility::test_course_6_3_computer_science
          - TestOptimizerFeasibility::test_course_6_4_ai_decision_making
          - TestOptimizerFeasibility::test_course_6_7_cs_molecular_biology
          - TestOptimizerFeasibility::test_course_6_9_computation_cognition
          - TestOptimizerFeasibility::test_course_6_14_cs_economics_data_science
          - TestOptimizerFeasibility::test_course_7_biology
          - TestOptimizerFeasibility::test_course_8_physics
          - TestOptimizerFeasibility::test_course_9_brain_cognitive_sciences
          - TestOptimizerFeasibility::test_course_11_urban_studies
          - TestOptimizerFeasibility::test_course_12_earth_science
          - TestOptimizerFeasibility::test_course_15_management
          - TestOptimizerFeasibility::test_course_16_aerospace
          - TestOptimizerFeasibility::test_course_18am_applied_mathematics
          - TestOptimizerFeasibility::test_course_18c_mathematics_cs
          - TestOptimizerFeasibility::test_course_18pm_mathematics
          - TestOptimizerFeasibility::test_course_20_biological_engineering
          - TestOptimizerFeasibility::test_double_major_6_3_and_15
          - TestOptimizerFeasibility::test_major_with_minor
          - TestRegressionBugs::test_regression_course_1_091_permission_of_instructor
          - TestRegressionBugs::test_regression_course_7_requires_10_semesters
          - TestRegressionBugs::test_regression_empty_prereq_groups_never_created
          - TestRegressionBugs::test_regression_threshold_zero_optional_groups

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv sync --extra dev

      - name: Run ${{ matrix.test }}
        working-directory: ./backend
        run: |
          uv run pytest tests/integration/optimizer/test_optimizer_feasibility.py::${{ matrix.test }} -v -s

  test-quality:
    name: Quality - ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_course_1_quality
          - test_course_2_quality
          - test_course_3_quality
          - test_course_3a_quality
          - test_course_3c_quality
          - test_course_4_quality
          - test_course_6_2_quality
          - test_course_6_3_new_quality
          - test_course_6_4_quality
          - test_course_6_7_quality
          - test_course_6_9_quality
          - test_course_6_14_quality
          - test_course_7_quality
          - test_course_8_quality
          - test_course_9_quality
          - test_course_11_quality
          - test_course_15_quality
          - test_course_16_quality
          - test_course_18am_quality
          - test_course_18c_quality
          - test_course_18pm_quality
          - test_course_20_quality

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv sync --extra dev

      - name: Run ${{ matrix.test }}
        working-directory: ./backend
        run: |
          uv run pytest tests/integration/optimizer/test_optimizer_quality.py::TestOptimizerQuality::${{ matrix.test }} -v -s

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv sync --extra dev

      - name: Run basedpyright
        working-directory: ./backend
        run: |
          uv run basedpyright courses/ optimizer/ api/

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [test-unit, test-feasibility, test-quality, type-check]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.test-feasibility.result }}" != "success" ] || \
             [ "${{ needs.test-quality.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All tests passed!"
