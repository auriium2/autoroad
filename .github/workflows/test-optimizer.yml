

name: Optimizer Comprehensive Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test-optimizer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run all unit tests
        working-directory: ./backend
        run: uv run pytest tests/unit/ -v

  test-feasibility:
    name: Feasibility - Group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            tests: "test_course_1_civil_engineering or test_course_2_mechanical_engineering"
          - group: 2
            tests: "test_course_3_materials_science or test_course_3a_materials_science_flexible"
          - group: 3
            tests: "test_course_3c_archaeology_materials or test_course_4_architecture"
          - group: 4
            tests: "test_course_6_2_eecs or test_course_6_3_computer_science"
          - group: 5
            tests: "test_course_6_4_ai_decision_making or test_course_6_7_cs_molecular_biology"
          - group: 6
            tests: "test_course_6_9_computation_cognition or test_course_6_14_cs_economics_data_science"
          - group: 7
            tests: "test_course_7_biology or test_course_8_physics"
          - group: 8
            tests: "test_course_9_brain_cognitive_sciences or test_course_11_urban_studies"
          - group: 9
            tests: "test_course_12_earth_science or test_course_15_management"
          - group: 10
            tests: "test_course_16_aerospace or test_course_18am_applied_mathematics"
          - group: 11
            tests: "test_course_18c_mathematics_cs or test_course_18pm_mathematics"
          - group: 12
            tests: "test_course_20_biological_engineering or test_double_major_6_3_and_15"
          - group: 13
            tests: "test_major_with_minor"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run feasibility tests
        working-directory: ./backend
        run: uv run pytest tests/integration/optimizer/test_optimizer_feasibility.py::TestOptimizerFeasibility -k "${{ matrix.tests }}" -v -s

  test-feasibility-regression:
    name: Feasibility Regression - Group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            tests: "test_regression_course_1_091_permission_of_instructor or test_regression_course_7_requires_10_semesters"
          - group: 2
            tests: "test_regression_empty_prereq_groups_never_created or test_regression_threshold_zero_optional_groups"
          - group: 3
            tests: "test_regression_ase_courses_satisfy_requirements"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run regression tests
        working-directory: ./backend
        run: uv run pytest tests/integration/optimizer/test_optimizer_feasibility.py::TestRegressionBugs -k "${{ matrix.tests }}" -v -s

  test-quality:
    name: Quality - Group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            tests: "test_course_1_quality or test_course_2_quality"
          - group: 2
            tests: "test_course_6_2_quality or test_course_6_3_new_quality"
          - group: 3
            tests: "test_course_6_9_quality or test_course_7_quality"
          - group: 4
            tests: "test_course_8_quality or test_course_9_quality"
          - group: 5
            tests: "test_course_11_quality or test_course_15_quality"
          - group: 6
            tests: "test_course_16_quality or test_course_18pm_quality"
          - group: 7
            tests: "test_course_20_quality"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run quality tests
        working-directory: ./backend
        run: uv run pytest tests/integration/optimizer/test_optimizer_quality.py::TestOptimizerQuality -k "${{ matrix.tests }}" -v -s

  test-integration:
    name: Integration - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Optimizer"
            file: "tests/integration/optimizer/test_optimizer_integration.py"
          - name: "Marker Integration"
            file: "tests/integration/optimizer/test_marker_integration.py"
          - name: "Marker Behavior"
            file: "tests/integration/optimizer/test_marker_behavior.py"
          - name: "Road File Regressions"
            file: "tests/integration/regressions/test_road_file_regressions.py"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run integration tests
        working-directory: ./backend
        run: uv run pytest ${{ matrix.file }} -v -s

  type-check:
    name: Type Checking
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run basedpyright
        working-directory: ./backend
        run: uv run basedpyright shared/ server/ worker/

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-24.04
    needs: [test-unit, test-feasibility, test-feasibility-regression, test-quality, test-integration, type-check]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.test-feasibility.result }}" != "success" ] || \
             [ "${{ needs.test-feasibility-regression.result }}" != "success" ] || \
             [ "${{ needs.test-quality.result }}" != "success" ] || \
             [ "${{ needs.test-integration.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All tests passed!"
