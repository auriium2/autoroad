name: Optimizer Comprehensive Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test-optimizer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run all unit tests
        working-directory: ./backend
        run: uv run pytest tests/unit/ -v

  test-feasibility:
    name: Feasibility - ${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_course_1_civil_engineering
          - test_course_2_mechanical_engineering
          - test_course_3_materials_science
          - test_course_3a_materials_science_flexible
          - test_course_3c_archaeology_materials
          - test_course_4_architecture
          - test_course_6_2_eecs
          - test_course_6_3_computer_science
          - test_course_6_4_ai_decision_making
          - test_course_6_7_cs_molecular_biology
          - test_course_6_9_computation_cognition
          - test_course_6_14_cs_economics_data_science
          - test_course_7_biology
          - test_course_8_physics
          - test_course_9_brain_cognitive_sciences
          - test_course_11_urban_studies
          - test_course_12_earth_science
          - test_course_15_management
          - test_course_16_aerospace
          - test_course_18am_applied_mathematics
          - test_course_18c_mathematics_cs
          - test_course_18pm_mathematics
          - test_course_20_biological_engineering
          - test_double_major_6_3_and_15
          - test_major_with_minor

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run feasibility test
        working-directory: ./backend
        run: uv run pytest tests/integration/optimizer/test_optimizer_feasibility.py::TestOptimizerFeasibility::${{ matrix.test }} -v -s

  test-feasibility-regression:
    name: Feasibility Regression - ${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_regression_course_1_091_permission_of_instructor
          - test_regression_course_7_requires_10_semesters
          - test_regression_empty_prereq_groups_never_created
          - test_regression_threshold_zero_optional_groups
          - test_regression_ase_courses_satisfy_requirements

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run regression test
        working-directory: ./backend
        run: uv run pytest tests/integration/optimizer/test_optimizer_feasibility.py::TestRegressionBugs::${{ matrix.test }} -v -s

  test-quality:
    name: Quality - ${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_course_1_quality
          - test_course_2_quality
          - test_course_6_2_quality
          - test_course_6_3_new_quality
          - test_course_6_9_quality
          - test_course_7_quality
          - test_course_8_quality
          - test_course_9_quality
          - test_course_11_quality
          - test_course_15_quality
          - test_course_16_quality
          - test_course_18pm_quality
          - test_course_20_quality

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run quality test
        working-directory: ./backend
        run: uv run pytest tests/integration/optimizer/test_optimizer_quality.py::TestOptimizerQuality::${{ matrix.test }} -v -s

  test-integration:
    name: Integration - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Optimizer"
            file: "tests/integration/optimizer/test_optimizer_integration.py"
          - name: "Marker Integration"
            file: "tests/integration/optimizer/test_marker_integration.py"
          - name: "Marker Behavior"
            file: "tests/integration/optimizer/test_marker_behavior.py"
          - name: "Road File Regressions"
            file: "tests/integration/regressions/test_road_file_regressions.py"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run integration tests
        working-directory: ./backend
        run: uv run pytest ${{ matrix.file }} -v -s

  type-check:
    name: Type Checking
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: ./backend/.venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen --extra dev

      - name: Run basedpyright
        working-directory: ./backend
        run: uv run basedpyright courses/ optimizer/ api/

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-24.04
    needs: [test-unit, test-feasibility, test-feasibility-regression, test-quality, test-integration, type-check]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.test-feasibility.result }}" != "success" ] || \
             [ "${{ needs.test-feasibility-regression.result }}" != "success" ] || \
             [ "${{ needs.test-quality.result }}" != "success" ] || \
             [ "${{ needs.test-integration.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All tests passed!"
