name: Optimizer Comprehensive Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/test-optimizer.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:  # Allow manual triggers

jobs:
  test-unit:
    name: Unit Tests (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv pip install -e ".[dev]"
      
      - name: Run prerequisite parser unit tests
        working-directory: ./backend
        run: |
          uv run pytest tests/test_prerequisites_parser.py -v
      
      - name: Run property-based tests
        working-directory: ./backend
        run: |
          uv run pytest tests/test_prerequisites_parser_property.py -v --hypothesis-show-statistics
      
      - name: Run requirement constraint builder unit tests
        working-directory: ./backend
        run: |
          uv run pytest tests/test_requirement_constraint_builder.py -v
      
      - name: Run prerequisite constraint builder unit tests
        working-directory: ./backend
        run: |
          uv run pytest tests/test_prerequisites_constraint_builder.py -v

  test-integration:
    name: Integration Tests (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv pip install -e ".[dev]"
      
      - name: Run comprehensive E2E tests
        working-directory: ./backend
        run: |
          uv run pytest tests/test_optimizer_e2e_comprehensive.py -v -s
      
      - name: Run regression tests
        working-directory: ./backend
        run: |
          uv run pytest tests/test_optimizer_e2e_comprehensive.py::TestRegressionBugs -v

  test-sanity:
    name: Sanity Checks (Critical Majors)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv pip install -e ".[dev]"
      
      - name: Test most popular majors
        working-directory: ./backend
        run: |
          uv run pytest tests/test_optimizer_e2e_comprehensive.py::TestOptimizerE2EComprehensive::test_course_6_3_computer_science -v
          uv run pytest tests/test_optimizer_e2e_comprehensive.py::TestOptimizerE2EComprehensive::test_course_6_2_eecs -v
          uv run pytest tests/test_optimizer_e2e_comprehensive.py::TestOptimizerE2EComprehensive::test_course_18_mathematics -v
      
      - name: Upload test results if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: backend/pytest-report.xml
          retention-days: 7

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv pip install -e ".[dev]"
      
      - name: Run basedpyright
        working-directory: ./backend
        run: |
          uv run basedpyright courses/ optimizer/ api/

  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv pip install -e ".[dev]"
      
      - name: Run ruff
        working-directory: ./backend
        run: |
          uv run ruff check .

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-sanity, type-check, lint]
    if: always()
    
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.test-integration.result }}" != "success" ] || \
             [ "${{ needs.test-sanity.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All tests passed! ✅"
