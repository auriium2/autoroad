name: Optimizer Comprehensive Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/test-optimizer.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:  # Allow manual triggers

jobs:
  test-unit:
    name: Unit Tests (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv sync --extra dev

      - name: Run all unit tests
        working-directory: ./backend
        run: |
          uv run pytest tests/unit/ -v

  test-feasibility:
    name: Feasibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv sync --extra dev

      - name: Run optimizer feasibility tests
        working-directory: ./backend
        run: |
          uv run pytest tests/integration/optimizer/test_optimizer_feasibility.py -v -s

  test-quality:
    name: Quality Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv sync --extra dev

      - name: Run optimizer quality tests
        working-directory: ./backend
        run: |
          uv run pytest tests/integration/optimizer/test_optimizer_quality.py -v -s

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv sync --extra dev

      - name: Run basedpyright
        working-directory: ./backend
        run: |
          uv run basedpyright courses/ optimizer/ api/

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [test-unit, test-feasibility, test-quality, type-check, lint]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.test-feasibility.result }}" != "success" ] || \
             [ "${{ needs.test-quality.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All tests passed!"
