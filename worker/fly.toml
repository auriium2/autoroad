# fly.toml app configuration file generated for autoroad-worker on 2026-01-11T16:58:04-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'autoroad-worker'
primary_region = 'ewr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 1
    soft_limit = 1

[[vm]]
  size = 'shared-cpu-8x'
  memory = '2gb'
  cpus = 8
  memory_mb = 2048
